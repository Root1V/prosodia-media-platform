<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prosodia</title>
    <script>
      // Aplica el tema antes de que React monte, para evitar un flash del
      // tema equivocado. Misma logica que src/lib/theme.ts (duplicada a
      // proposito: este script debe correr antes de que cargue el bundle).
      // Si se cambia alla, hay que cambiarlo aqui: desincronizados no da
      // ningun error, solo un parpadeo al cargar que es dificil de atribuir.
      (function () {
        var stored = localStorage.getItem('prosodia-theme')
        var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
