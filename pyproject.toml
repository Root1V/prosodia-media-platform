[project]
name = "video-translator"
version = "1.4.0"
description = "Traduccion de videos MP4 largos (EN -> ES) usando IA open source (Whisper, LLM local via Ollama, Coqui TTS)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Video Translator Team" }]

dependencies = [
    "faster-whisper>=1.0.3",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.3.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "structlog>=24.1.0",
    "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
# Motor recomendado para doblaje (IndexTTS-2.5): control nativo de duracion,
# ideal para sincronizacion audiovisual. No esta en PyPI: se instala como
# dependencia de ruta local (ver [tool.uv.sources] abajo) apuntando al repo
# clonado en third_party/index-tts por ./scripts/setup_index_tts2.sh.
# IMPORTANTE: el clonado debe existir ANTES de correr "uv sync" o "uv lock"
# con este extra activo, o uv fallara al no encontrar la ruta. Por eso el
# script clona primero y recien despues corre "uv sync --extra dubbing-indextts".
dubbing-indextts = ["indextts", "huggingface-hub[cli]>=0.24.0"]

# Alternativa mas liviana de instalar (XTTS v2 via pip). No soporta Python >= 3.12.
dubbing-coqui = ["TTS>=0.22.0; python_version < '3.12'", "pydub>=0.25.1"]

# Transcripcion acelerada por GPU en Apple Silicon (Metal), via el framework
# MLX de Apple. faster-whisper (motor por defecto) corre sobre CTranslate2,
# que NO soporta Metal/MPS -- en Mac esta limitado a CPU sin importar la
# configuracion. mlx-whisper si usa la GPU, y en M-series suele ser varias
# veces mas rapido que CTranslate2 en CPU para el mismo modelo. Solo
# disponible en macOS con Apple Silicon.
transcription-mlx = ["mlx-whisper>=0.4.0; sys_platform == 'darwin'"]

dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.8",
]

# Dashboard web de administracion (Prosodia Web): API REST (FastAPI) + cola de
# tareas (Celery/Redis) + persistencia (Postgres via SQLAlchemy/Alembic) que
# envuelve el pipeline existente como un segundo "driver" (junto a cli.py),
# sin modificar application/domain. Ver src/video_translator/web/.
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.19",
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 (ultima version en PyPI) detecta la version de bcrypt via
    # el atributo `bcrypt.__about__`, removido en bcrypt>=4.1 -- sin este tope
    # passlib.hash.bcrypt revienta con "password cannot be longer than 72
    # bytes" incluso con passwords cortas. Ver https://github.com/pyca/bcrypt/issues/684.
    "bcrypt<4.1",
    "python-multipart>=0.0.9",
    "yt-dlp>=2024.7.1",
    "email-validator>=2.0.0",
    # Telemetria OpenTelemetry hacia Argus (ver RM-41). Va en este extra y no
    # en las dependencias core porque solo la usan los dos drivers web
    # (web/main.py y web/tasks/celery_app.py); la CLI no la necesita.
    # Version exacta a proposito: es un prelanzamiento (alfa) y "pip install
    # argus-obs-sdk" a secas no se lo lleva. Sin los extras [grpc]/[http] usa
    # su exportador OTLP/HTTP con JSON, que no arrastra opentelemetry-proto y
    # por tanto no choca con el protobuf<3.20 que exige IndexTTS (ver S-03).
    "argus-obs-sdk[asgi,celery]==1.0.0a4",
]

[project.scripts]
video-translator = "video_translator.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# "dubbing-coqui" (TTS==0.22.0, exige pandas<2.0/numpy<2.0) choca de version
# con "dubbing-indextts" (sus dependencias transitivas, p.ej. modelscope,
# exigen pandas/numpy >= 2.x). uv resuelve un lockfile universal que por
# defecto intenta satisfacer TODOS los extras a la vez, aunque no se instalen
# juntos; esto le dice que no hace falta una solucion conjunta. En la
# practica no se pierde nada: el motor de doblaje recomendado es
# "dubbing-indextts", no "dubbing-coqui".
#
# NOTA sobre diarizacion: pyannote.audio NO es un extra de este proyecto.
# Corre en un venv completamente aparte (./scripts/setup_diarization_env.sh),
# invocado por subprocess, porque tiene un conflicto de version de protobuf
# con IndexTTS-2.5 que no se puede resolver dentro de un mismo entorno
# (pyannote.audio exige protobuf>=5.0 via pyannoteai-sdk; IndexTTS-2.5 exige
# protobuf<3.20 via descript-audiotools). Ver infrastructure/diarization/.
conflicts = [
    [
        { extra = "dubbing-coqui" },
        { extra = "dubbing-indextts" },
    ],
]

[tool.uv.sources]
# "indextts" no esta en PyPI: se resuelve desde el clon local que hace
# ./scripts/setup_index_tts2.sh. Declararlo aqui (en vez de instalarlo con un
# "pip install -e" suelto) es lo que permite que sobreviva a futuros
# "uv sync": si no esta en el lockfile, uv lo desinstala en cada sync por
# considerarlo un paquete "extraño" al proyecto.
indextts = { path = "third_party/index-tts", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# typer.Option()/typer.Argument() en los defaults de una funcion es el patron
# idiomatico documentado por Typer (inspecciona los defaults al importar el
# modulo para construir el CLI) -- no es el antipatron de "mutable default"
# que B008 busca detectar en general. Mismo razonamiento para fastapi.Depends()
# y fastapi.File() en los defaults de los endpoints (web/).
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.File"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
